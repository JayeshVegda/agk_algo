services:
  db:
    image: postgres:16-alpine
    container_name: akg_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-akg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-akg_algo}
    command: postgres -c shared_buffers=16MB -c max_connections=25 -c work_mem=1MB
    mem_limit: 64m
    volumes:
      - akg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-akg_user} -d ${POSTGRES_DB:-akg_algo}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default
      - proxy-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.standalone
    container_name: akg_web
    restart: unless-stopped
    env_file:
      - .env
    mem_limit: 128m
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - akg_storage_data:/app/storage
    networks:
      - default
      - proxy-net

volumes:
  akg_postgres_data:
  akg_storage_data:

networks:
  proxy-net:
    external: true
