services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: akg_pocketbase
    restart: unless-stopped
    ports:
      - "8095:8090"
    volumes:
      - ./pb_data:/pb_data
      - ./pb_public:/pb_public
    networks:
      - default
      - proxy-net

networks:
  proxy-net:
    external: true
