name: CI

on:
  push:
    branches: [main, green-theme]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build -- --outDir "$RUNNER_TEMP/akg-web"
      - name: Check PocketBase hooks
        run: |
          for hook in pb_hooks/*.js pb_migrations/*.js; do
            node --check "$hook" || exit 1
          done
      - name: Apply migrations to an empty database
        run: |
          ./bin/pocketbase migrate up --dir="$RUNNER_TEMP/akg-data" --migrationsDir="$PWD/pb_migrations" --hooksDir="$PWD/pb_hooks"
