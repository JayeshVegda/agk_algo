name: CI

on:
  push:
    branches: [main, green-theme]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build -- --outDir "$RUNNER_TEMP/akg-web"
      - name: Verify storefront HTML
        run: |
          node --input-type=module - "$RUNNER_TEMP/akg-web" <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { siteOrigin, storefrontPages } from './frontend/src/lib/storefrontPages.js';

          const dir = process.argv[2];
          for (const [path, page] of Object.entries(storefrontPages)) {
            const html = readFileSync(join(dir, 'storefront', page.file + '.html'), 'utf8');
            assert.equal(html.match(/rel="canonical"/g)?.length, 1, path);
            assert.ok(html.includes(`rel="canonical" href="${siteOrigin}${path}"`), path);
            assert.ok(html.includes(page.heading) && html.includes(page.guideHeading), path);
            assert.ok(html.includes('"@type": "Organization"'), path);
          }
          const shell = readFileSync(join(dir, 'index.html'), 'utf8');
          assert.ok(!shell.includes('rel="canonical"'), 'SPA fallback must not canonicalize pages to the home page');
          JS
      - name: Check PocketBase hooks
        run: |
          for hook in pb_hooks/*.js pb_migrations/*.js; do
            node --check "$hook" || exit 1
          done
      - name: Apply migrations to an empty database
        run: |
          ./bin/pocketbase migrate up --dir="$RUNNER_TEMP/akg-data" --migrationsDir="$PWD/pb_migrations" --hooksDir="$PWD/pb_hooks"
      - name: Verify fresh payment schema
        run: |
          python3 - "$RUNNER_TEMP/akg-data/data.db" <<'PYTHON'
          import sqlite3
          import sys

          with sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True) as db:
              expected = '@request.auth.id != "" && (@request.auth.role = "admin" || user_email = @request.auth.email)'
              rules = db.execute("SELECT listRule, viewRule FROM _collections WHERE name = 'payments'").fetchone()
              assert rules == (expected, expected), "Payment reads must be owner- or admin-only"
              columns = {row[1] for row in db.execute("PRAGMA table_info(payments)")}
              assert {"license_key", "signal_cycle", "bound_account", "bound_at"} <= columns
              triggers = {row[0] for row in db.execute(
                  "SELECT name FROM sqlite_master WHERE type = 'trigger' AND tbl_name = 'payments'"
              )}
              assert {"payments_reference_insert", "payments_reference_update"} <= triggers
          PYTHON
      - name: Verify atomic signal broadcasts
        run: |
          mkdir -p "$RUNNER_TEMP/akg-test-hooks"
          cp pb_hooks/*.js tests/verify-signal-broadcast.pb.js "$RUNNER_TEMP/akg-test-hooks/"
          ./bin/pocketbase verify-signal-broadcast --dir="$RUNNER_TEMP/akg-data" --hooksDir="$RUNNER_TEMP/akg-test-hooks" --migrationsDir="$PWD/pb_migrations"
